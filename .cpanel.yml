# Despliegue con cPanel › Git™ Version Control › "Deploy HEAD Commit".
# Copia el contenido de public_html/ (landing + sistema en panel/) a public_html del hosting.
# No borra nada: la conexión a la base (panel/app/config.local.php) y las fotos subidas se conservan.
---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/cp -R public_html/. $DEPLOYPATH
    - if [ -f $DEPLOYPATH/panel/app/config.local.php ]; then /bin/rm -f $DEPLOYPATH/panel/seed_web.php; fi
